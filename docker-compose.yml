version: '3.8'

services:
  # 1. IDENTITY & AUTHENTICATION
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    # Chế độ dev hỗ trợ HTTP cục bộ
    command: start-dev
    # Yêu cầu cổng 8180
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Tự động import realm (nếu file tồn tại)
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/realm.json
    volumes:
      - ./idp:/opt/keycloak/data/import
    networks:
      - nt219_net

  # 2. KEY MANAGEMENT & SECRETS
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    env_file:
      - .env
    command: server
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
      - ./vault-config.json:/vault/config/vault-config.json
    networks:
      - nt219_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. POLICY ENGINE
  opa:
    image: openpolicyagent/opa:latest
    container_name: opa
    # Yêu cầu cổng 8181
    ports:
      - "127.0.0.1:8181:8181"
    command: run --server --log-level=debug /policies
    volumes:
      - ./opa:/policies
    networks:
      - nt219_net

  # 4. MONITORING STUBS
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # Yêu cầu cổng 9090
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - nt219_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # Yêu cầu cổng 3000
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - nt219_net

  # 5. API GATEWAY & MICROSERVICES (STUBS)
  api-gateway:
    image: envoyproxy/envoy:v1.30-latest
    container_name: api-gateway
    # Yêu cầu cổng 8080/8443
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./infra/certs:/etc/envoy/certs:ro
    depends_on:
      - user-service
      - payment-service
    networks:
      - nt219_net

  catalog-service:
    image: node:24-alpine
    container_name: catalog-service
    command: tail -f /dev/null
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - nt219_net

  cart-service:
    image: node:24-alpine
    container_name: cart-service
    command: tail -f /dev/null
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - nt219_net

  order-service:
    image: node:24-alpine
    container_name: order-service
    command: tail -f /dev/null
    ports:
      - "127.0.0.1:8003:8003"
    networks:
      - nt219_net

  payment-service:
    image: node:24-alpine
    build: ./services/payment
    container_name: payment-service
    volumes:
      - ./services/payment:/app
      - /app/node_modules
    ports:
      - "8004:8004"
    env_file:
      - .env
    networks:
      - nt219_net
    depends_on:
        vault:
            condition: service_healthy

  user-service:
    image: node:24-alpine
    build: ./services/user
    container_name: user-service
    volumes:
      - ./services/user:/app
      - /app/node_modules
    ports:
      - "8005:8005"
    env_file:
      - .env
    networks:
      - nt219_net
    depends_on:
        vault:
            condition: service_healthy

networks:
  nt219_net:
    driver: bridge

volumes:
  vault_data: