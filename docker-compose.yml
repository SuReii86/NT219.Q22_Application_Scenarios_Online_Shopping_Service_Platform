services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./idp:/opt/keycloak/data/import:ro
    networks:
      - nt219_net
  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_VAULT_PATH: ${MONGODB_VAULT_PATH}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    volumes:
      - ./vault/setup-vault.sh:/setup-vault.sh:ro
    command: sh /setup-vault.sh
    networks:
      - nt219_net
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    command: server -dev -dev-root-token-id=${VAULT_TOKEN} -dev-listen-address=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - nt219_net

  opa:
    image: openpolicyagent/opa:latest-envoy
    container_name: opa
    command:
      - run
      - --server
      - --config-file=/policies/opa-config.yaml
      - --log-level=debug
      - /policies/policy.rego
    ports:
      - "127.0.0.1:8181:8181"
    expose:
      - "9191"
    volumes:
      - ./opa:/policies:ro
    networks:
      - nt219_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - nt219_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - nt219_net

  api-gateway:
    image: envoyproxy/envoy:v1.30-latest
    container_name: api-gateway
    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --service-cluster
      - api-gateway
      - --log-level
      - info
    ports:
      - "8080:8080"
      - "8443:8443"
      - "127.0.0.1:9901:9901"
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./infra/certs:/etc/envoy/certs:ro
    depends_on:
      - opa
      - keycloak
      - user-service
      - catalog-service
      - cart-service
      - order-service
      - payment-service
      - inventory-service
      - shipping-service
      - notification-service
    networks:
      - nt219_net

  catalog-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/catalog
    container_name: catalog-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - vault
      - vault-init
      - keycloak
    networks:
      - nt219_net

  cart-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/cart
    container_name: cart-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - vault
      - vault-init
      - keycloak
      - catalog-service
    networks:
      - nt219_net

  order-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/order
    container_name: order-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      - vault
      - vault-init
      - keycloak
      - cart-service
      - payment-service
      - inventory-service
      - shipping-service
      - notification-service
    networks:
      - nt219_net

  payment-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/payment
    container_name: payment-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      - vault
      - vault-init
      - keycloak
    networks:
      - nt219_net

  user-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/user
    container_name: user-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      - vault
      - vault-init
      - keycloak
    networks:
      - nt219_net

  inventory-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/inventory
    container_name: inventory-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      - vault
      - vault-init
      - keycloak
    networks:
      - nt219_net

  shipping-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/shipping
    container_name: shipping-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8007:8007"
    depends_on:
      - vault
      - vault-init
      - keycloak
    networks:
      - nt219_net

  notification-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/notification
    container_name: notification-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      - vault
      - vault-init
      - keycloak
    networks:
      - nt219_net

networks:
  nt219_net:
    driver: bridge